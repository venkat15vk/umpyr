# Local dev database. Requires Docker. If you don't have Docker, run
# `uv run umpyr db local` instead (embedded PostgreSQL 16 + pgvector via pgserver).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: umpyr
      POSTGRES_PASSWORD: umpyr
      POSTGRES_DB: umpyr
    ports:
      - "5432:5432"
    volumes:
      - umpyr_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umpyr -d umpyr"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  umpyr_pgdata:
