[project]
name = "umpyr-engine"
version = "0.1.0"
description = "Umpyr Resolve engine: FastAPI API + background worker"
requires-python = ">=3.12"
dependencies = [
  "umpyr-ontology",
  "umpyr-rules",
  "anthropic>=1.15,<2",
  "voyageai>=0.5,<1",
  "fastapi>=0.149,<1",
  "uvicorn[standard]>=0.54,<1",
  "sqlalchemy>=2.1,<3",
  "psycopg[binary]>=3.3,<4",
  "pgvector>=0.5,<1",
  "alembic>=1.20,<2",
  "pydantic>=2.14,<3",
  "pydantic-settings>=2.16,<3",
  "sse-starlette>=3.5,<4",
  "python-dotenv>=1.2,<2",
  "httpx>=0.28,<1",
  "trafilatura>=2.0,<3",
  "pymupdf>=1.25,<2",
  "python-docx>=1.1,<2",
  "scikit-learn>=1.6,<2",
  "numpy>=2.0,<3",
  "openpyxl>=3.1,<4",
  "lxml>=5.0,<7",
  "python-multipart>=0.0.20,<1",
]

[project.scripts]
umpyr = "umpyr_engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umpyr_engine"]

[tool.uv.sources]
umpyr-ontology = { workspace = true }
umpyr-rules = { workspace = true }
