[project]
name = "umpyr-rules"
version = "0.1.0"
description = "Umpyr rule format, JSON Logic evaluator, precedence, PDP and audit hashing"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3", "umpyr-ontology"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umpyr_rules"]

[tool.uv.sources]
umpyr-ontology = { workspace = true }
