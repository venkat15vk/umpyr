[project]
name = "umpyr-ontology"
version = "0.1.0"
description = "Umpyr ontology: Pydantic models for Order, Shipment, Item, Booking, Flight, Bag, Customer, Case, Ticket"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["umpyr_ontology"]
